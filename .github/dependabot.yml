version: 2

updates:
  # GitHub deprecates action runtimes on its own schedule; this catches that before a release does.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Kotlin, KSP and KotlinPoet are a matched set and Dependabot cannot know that: it will raise
      # Kotlin past the newest KSP built for it. Bump the trio by hand together.
      # See the note at the top of gradle/libs.versions.toml.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.squareup:kotlinpoet*"
