# Kotlin, KSP and KotlinPoet must move as a matched set.
#
# KSP is published against one specific Kotlin version: symbol-processing-api 2.3.11 is built
# against Kotlin 2.3.20, and no KSP release targets Kotlin 2.4.x yet. Raising `kotlin` on its own
# leaves the processor compiling against a Kotlin it was never built for. KotlinPoet 2.3.0 aligns
# with the same set.
#
# 2.3.20 is therefore the newest mutually compatible trio. Bump all three together when a matched
# set ships. Dependabot is configured to leave them alone; see .github/dependabot.yml.
[versions]
kotlin = "2.3.20"
ksp = "2.3.11"
kotlinpoet = "2.3.0"
mavenPublish = "0.37.0"
kctfork = "0.13.0"
dokka = "2.2.0"
junit = "6.1.3"

[libraries]
ksp-symbolProcessingApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# Test-only: KSP2-capable compile-testing fork for processor negative tests.
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

# Test-only: aligns the JUnit 5 platform (used by kotlin-test) to the catalog-pinned version.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# Build-tool only: compiled against by tools/dokka-json, which runs inside Dokka's worker and
# therefore declares both as compileOnly. Must track the `dokka` version exactly — the plugin binds
# to Dokka's extension points, so a mismatch fails at generation time rather than at compile time.
dokka-core = { module = "org.jetbrains.dokka:dokka-core", version.ref = "dokka" }
dokka-base = { module = "org.jetbrains.dokka:dokka-base", version.ref = "dokka" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
