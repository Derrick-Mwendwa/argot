[versions]
kotlin = "2.3.20"
ksp = "2.3.9"
kotlinpoet = "2.3.0"
mavenPublish = "0.36.0"
kctfork = "0.13.0"
junit = "5.10.1"

[libraries]
ksp-symbolProcessingApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# Test-only: KSP2-capable compile-testing fork for processor negative tests.
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

# Test-only: aligns the JUnit 5 platform (used by kotlin-test) to the catalog-pinned version.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
