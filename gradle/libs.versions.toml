# Single source of truth for all dependency and plugin versions used across Argot.
#
# Toolchain compatibility note:
#   The latest published KSP (symbol-processing-api:2.3.9) is built against Kotlin 2.3.20,
#   and there is no KSP release yet for Kotlin 2.4.0. KotlinPoet 2.3.0 likewise aligns with
#   Kotlin 2.3.20. So 2.3.20 is the latest *mutually compatible* Kotlin/KSP/KotlinPoet set —
#   that is the trio pinned below. Bump all three together when a newer matched set ships.
[versions]
kotlin = "2.3.20"
ksp = "2.3.9"
kotlinpoet = "2.3.0"
mavenPublish = "0.36.0"
kctfork = "0.13.0"
# JUnit 5 is used only by tests (via kotlin-test's JUnit Platform runner). Pinned here so the
# catalog is the single source of versions; this matches what kotlin-test resolves transitively.
junit = "5.10.1"

[libraries]
# Compile-time only (argot-processor): KSP API + KotlinPoet. Never on a consumer runtime classpath.
ksp-symbolProcessingApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# Test-only: KSP2-capable compile-testing fork for processor negative tests.
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

# Test-only: aligns the JUnit 5 platform (used by kotlin-test) to the catalog-pinned version.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
