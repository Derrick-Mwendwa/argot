<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Argot — content editor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      Sveltia CMS is a single script that talks to the GitHub API from the browser: edits become
      ordinary commits on main, and the site rebuilds from them the way it would after any push.
      There is no server holding content and nothing to keep in sync.

      This file also lands in every versioned docs tree, because VitePress copies public/ into both
      builds. Harmless — /docs/<version>/admin/ edits the same repository as /admin/ — and cheaper
      than splitting the public directory in two just to avoid it.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
